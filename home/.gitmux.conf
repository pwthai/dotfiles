tmux:
  symbols:
    branch: ' ' 
    hashprefix: ':'
    ahead: ↑·
    behind: ↓·
    staged: '● '
    conflict: '✖ '
    modified: '✚ '
    untracked: '… '
    stashed: '⚑ '
    clean: ✔
  styles:
    clear: "#[fg=default]"
    state: "#[fg=#e55454,bold]"
    branch: "#[fg=#f2e3dc,bold]"
    remote: "#[fg=#f4c27a]"
    divergence: "#[fg=#aa8588]"
    staged: "#[fg=#f4c27a,bold]"
    conflict: "#[fg=#e55454,bold]"
    modified: "#[fg=#f07863,bold]"
    untracked: "#[fg=#eaa0a0,bold]"
    stashed: "#[fg=#ffb38a,bold]"
    clean: "#[fg=#f4c27a,bold]"
  layout: [branch, " "]
  options:
    branch_max_len: 0
    branch_trim: right
