# Basic Settings
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g history-limit 10000
set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on
set -g mouse on
set -sg escape-time 0
setw -g automatic-rename on
set -g automatic-rename-format "#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}"
set -g display-time 4000
set -g status-interval 5
set -g default-command ""
set -g default-shell $SHELL

# Keep prefix as default (Ctrl+b)
set -g prefix C-b

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vim-style copy mode
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Better pane splitting with intuitive keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Quick window switching
bind -r C-h previous-window
bind -r C-l next-window

# Session management
bind C-c new-session

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Floating tools
set -g popup-style "bg=default,fg=#f2e3dc"
set -g popup-border-style "bg=default,fg=#e55454"

# Choose-tree's session preview uses its own styles; keep it Akane rather than grey.
# Keep interactive picker prompts below the top status bar, on their own bright row.
set -g message-line 1
set -g message-style "fg=#211a24,bg=#f4c27a,bold"
set -g tree-mode-border-style "fg=#eaa0a0,bg=#211a24"
set -g tree-mode-preview-style "fg=#f2e3dc,bg=#241b20"
set -g tree-mode-selection-style "fg=#211a24,bg=#e55454,bold"

# Lazygit / Lazydocker / tuicr floats (prefix + l, then g/d/r)
bind l switch-client -T lazygit
bind -T lazygit g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind -T lazygit d display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazydocker"
bind -T lazygit r display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "tuicr"
bind -T lazygit Escape switch-client -T prefix

# Status bar position (top)
set -g status-position top
set -g status on
set -gu status-format[1]
set -g pane-border-status off
set -g pane-border-format ""
set -Fg 'pane-border-style' '#{?pane_active,fg=#e55454,fg=#7f303a}'
setw -g pane-border-lines heavy

# Self-contained Akane status and pane treatment.
set -g status-style "bg=default,fg=#aa8588"
set -g pane-border-style "fg=#7f303a"
set -g pane-active-border-style "fg=#e55454"
setw -g window-status-format "#[fg=#241B20,bg=default]◖#[fg=#AA8588,bg=#241B20] #I:#W #[fg=#241B20,bg=default]◗ "
setw -g window-status-current-format "#[fg=#E55454,bg=default]◖#[fg=#211A24,bg=#E55454,bold] #I:#W #[fg=#E55454,bg=default]◗ "
setw -g window-status-activity-style "fg=#f07863,bold"

# Window activity
setw -g monitor-activity on
set -g visual-activity off

# Pane display
set -g display-panes-active-colour "#e55454"
set -g display-panes-colour "#7f303a"
set -g display-panes-time 2000

# TPM Plugin Manager
set -g @plugin 'tmux-plugins/tpm'

# Initialize TPM for user-managed plugins.
run '~/.tmux/plugins/tpm/tpm'

# Status bar configuration
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#[fg=#211A24,bg=#f4c27a,bold] #S "
set -g status-right "#(gitmux -cfg $HOME/.gitmux.conf \"#{pane_current_path}\")"
